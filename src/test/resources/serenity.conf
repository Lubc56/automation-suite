serenity {
  project.name = "Automation Framework - UI & API"
  take.screenshots = FOR_FAILURES
  reports {
    show.step.details = true
  }
}

webdriver {
  driver = provided
  provided {
    type = chrome
    driver = com.automation.utils.ChromeDriverSource
  }
}

environments {
  default {
    base.url = "https://www.saucedemo.com"
  }
}

cucumber.publish.quiet = true
